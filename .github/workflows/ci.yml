name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Single pipeline, two jobs:
#   quality      — lint + typecheck + unit tests with coverage thresholds.
#   e2e-windows  — full build + Playwright Electron E2E on the packaging OS.
# Both MUST pass before merge; scope of lint/typecheck is identical in each
# place it runs so the gates cannot drift.

jobs:
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit (both configs) + eslint over main/agent/shared/renderer.
      # Exits non-zero on any type error or lint ERROR (legacy `any` is a
      # WARNING here so CI stays green while the backlog is cleaned).
      - name: Lint & typecheck
        run: npm run lint

      # One-way ratchet: repo-wide explicit-`any` count must never exceed the
      # recorded baseline; it is lowered automatically whenever the count drops.
      - name: any ratchet
        run: node scripts/any-ratchet.mjs

      - name: Test (with coverage)
        run: npm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e-windows:
    name: Build + E2E (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ---- Compile main process (needed by E2E) ----
      - name: Build main process
        run: npx tsc -p config/tsconfig.main.json

      # ---- Production build (renderer) ----
      - name: Build renderer
        run: npx vite build --config config/vite.config.ts

      # ---- End-to-end tests (Electron + Playwright): smoke + workspace workflow ----
      # Playwright downloads its own browser; we tell it to also use the
      # system-installed Electron dist pointed at by node_modules.
      - name: Run E2E tests
        run: npx playwright test tests/e2e --config tests/e2e/playwright.config.ts
